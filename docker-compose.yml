services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: masaki
      POSTGRES_PASSWORD: Bluetooth5.0
      POSTGRES_DB: reservation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: